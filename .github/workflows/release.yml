name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Check the tag against the version name
        run: |
          grep -qF "versionName \"${GITHUB_REF_NAME}\"" app/build.gradle || { echo "Tag ${GITHUB_REF_NAME} differs from versionName in app/build.gradle"; exit 1; }
      - name: Decode signing key
        env:
          SIGNING_JKS_FILE_BASE64: ${{ secrets.SIGNING_JKS_FILE_BASE64 }}
        run: |
          test -n "${SIGNING_JKS_FILE_BASE64:-}" || { echo "SIGNING_JKS_FILE_BASE64 is empty or unset"; exit 1; }
          echo -n "$SIGNING_JKS_FILE_BASE64" | base64 -d > app/upload-keystore.jks
      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk mach-launcher-universal-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: mach-launcher-universal-release.apk
          fail_on_unmatched_files: true
