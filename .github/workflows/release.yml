name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Check the tag against the version name
        run: |
          grep -qF "versionName \"${GITHUB_REF_NAME}\"" app/build.gradle || { echo "Tag ${GITHUB_REF_NAME} differs from versionName in app/build.gradle"; exit 1; }
      - name: Find the release notes for the version code
        run: |
          code=$(sed -n 's/^ *versionCode \([0-9]*\)$/\1/p' app/build.gradle)
          notes="fastlane/metadata/android/en-US/changelogs/${code}.txt"
          test -s "$notes" || { echo "$notes is missing or empty"; exit 1; }
          echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"
      - name: Decode signing key
        env:
          SIGNING_JKS_FILE_BASE64: ${{ secrets.SIGNING_JKS_FILE_BASE64 }}
        run: |
          test -n "${SIGNING_JKS_FILE_BASE64:-}" || { echo "SIGNING_JKS_FILE_BASE64 is empty or unset"; exit 1; }
          echo -n "$SIGNING_JKS_FILE_BASE64" | base64 -d > app/upload-keystore.jks
      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk mach-launcher-universal-release.apk
      - uses: softprops/action-gh-release@v3
        with:
          files: mach-launcher-universal-release.apk
          body_path: ${{ env.RELEASE_NOTES }}
          fail_on_unmatched_files: true
      - name: Add the release to the F-Droid repository
        env:
          GH_TOKEN: ${{ secrets.FDROID_REPO_TOKEN }}
        run: gh workflow run publish.yml --repo terminalis/packages --ref main
